<style>

.status{

.error{

}

th,

@media(max-width:700px){

    grid-template-columns:repeat(2,1fr);

<body>

<div class="app">

<header>

<h1>🎪 KERMÉS POS</h1>

<div class="sub">
Caja rápida · versión estable
</div>

</header>

<nav>

<button
  id="navSell"
  class="nav-btn active"
  onclick="show('sell')"
>
🛒 Cobrar
</button>

<button
  id="navClose"
  class="nav-btn"
  onclick="show('close')"
>
📊 Corte
</button>

<button
  id="navTickets"
  class="nav-btn"
  onclick="show('tickets')"
>
🎟️ Boletos
</button>

<button
  id="navAdmin"
  class="nav-btn"
  onclick="show('admin')"
>
⚙️ Admin
</button>

</nav>

<main id="screen"></main>

</div>

<script>

/* =====================================================
   CONFIGURACIÓN SUPABASE
   ===================================================== */

const SUPABASE_URL = "https://lvcgbghgpzmehwxzhqcr.supabase.co";

const SUPABASE_ANON_KEY = "sb_publishable_-E-GZccnts6CiwuQWivJ2A_XNISGlbT";


/* =====================================================
   VARIABLES
   ===================================================== */

let db = null;

let products = [];

let cart = [];

let sales = [];

let cashMovements = [];

let tickets = [];

let events = [];

let activeEvent = null;

let currentView = "sell";

// Lector de boletos: se mantiene separado del flujo actual de ventas.
let ticketScanner = null;
let scannedTicket = null;
let pendingTicketCodes = [];


/* =====================================================
   INICIALIZAR SUPABASE
   ===================================================== */

function initSupabase(){

  try{

    if(
      !SUPABASE_URL ||
      SUPABASE_URL.includes("PEGA_AQUI") ||
      !SUPABASE_ANON_KEY ||
      SUPABASE_ANON_KEY.includes("PEGA_AQUI")
    ){

      throw new Error(
        "Faltan las credenciales de Supabase."
      );

    }

    if(
      typeof window.supabase === "undefined" ||
      typeof window.supabase.createClient !== "function"
    ){

      throw new Error(
        "No se pudo cargar la librería de Supabase."
      );

    }

    db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    return true;

  }catch(error){

    console.error(error);

    db = null;

    return false;

  }

}


/* =====================================================
   UTILIDADES
   ===================================================== */

function money(value){

  return Number(value || 0).toLocaleString(
    "es-MX",
    {
      style:"currency",
      currency:"MXN"
    }
  );

}


function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function errorMessage(message){

  return `
    <div class="error">
      ⚠️ ${escapeHtml(message)}
    </div>
  `;

}


/* =====================================================
   EVENTO
   ===================================================== */

async function loadEvents(){

  if(!db){

    return;

  }

  const result = await db
    .from("events")
    .select("*")
    .order("id",{ascending:false});

  if(result.error){

    console.error(result.error);

    throw result.error;

  }

  events = result.data || [];

  activeEvent =
    events.find(e => e.active === true) ||
    events[0] ||
    null;

}


/* =====================================================
   PRODUCTOS
   ===================================================== */

async function loadProducts(){

  if(!db){

    return;

  }

  const result = await db
    .from("products")
    .select("*")
    .eq("active",true)
    .order("id");

  if(result.error){

    throw result.error;

  }

  products = result.data || [];

}


/* =====================================================
   VENTAS
   ===================================================== */

async function loadSales(){

  if(!db){

    return;

  }

  const result = await db
    .from("sales")
    .select("*")
    .order("created_at",{ascending:false})
    .limit(500);

  if(result.error){

    throw result.error;

  }

  sales = result.data || [];

}


/* =====================================================
   MOVIMIENTOS DE CAJA
   ===================================================== */

async function loadCashMovements(){

  if(!db){

    return;

  }

  const result = await db
    .from("cash_movements")
    .select("*")
    .order("created_at",{ascending:false})
    .limit(500);

  if(result.error){

    throw result.error;

  }

  cashMovements = result.data || [];

}


/* =====================================================
   BOLETOS
   ===================================================== */

async function loadTickets(){

  if(!db){

    return;

  }

  const result = await db
    .from("tickets")
    .select("*")
    .order("created_at",{ascending:false})
    .limit(500);

  if(result.error){

    console.error("No se pudieron cargar boletos:", result.error);

    tickets = [];

    return;

  }

  tickets = result.data || [];

}


/* =====================================================
   CARGA GENERAL
   ===================================================== */

async function loadAll(){

  if(!db){

    return;

  }

  await loadEvents();

  await loadProducts();

  await loadSales();

  await loadCashMovements();

  await loadTickets();

}


/* =====================================================
   NAVEGACIÓN
   ===================================================== */

function show(view){

  stopTicketScanner();
  scannedTicket = null;

  currentView = view;

  document
    .querySelectorAll(".nav-btn")
    .forEach(btn => btn.classList.remove("active"));

  if(view === "sell"){

    document
      .getElementById("navSell")
      .classList.add("active");

    renderSell();

  }

  if(view === "close"){

    document
      .getElementById("navClose")
      .classList.add("active");

    renderClose();

  }

  if(view === "tickets"){

    document
      .getElementById("navTickets")
      .classList.add("active");

    renderTickets();

  }

  if(view === "admin"){

    document
      .getElementById("navAdmin")
      .classList.add("active");

    renderAdmin();

  }

}


/* =====================================================
   COBRAR
   ===================================================== */

function renderSell(){

  const screen =
    document.getElementById("screen");

  if(!activeEvent){

    screen.innerHTML = `

      <div class="card">

        <h2>🛒 Nueva venta</h2>

        <div class="empty">
          No hay un evento activo.
        </div>

        <button
          class="primary"
          onclick="show('admin')"
        >
          ⚙️ Crear evento
        </button>

      </div>

    `;

    return;

  }


  screen.innerHTML = `

    <div class="card">

      <h2>🛒 Nueva venta</h2>

      <div class="small">
        Evento activo
      </div>

      <h3>
        ${escapeHtml(activeEvent.name)}
      </h3>

    </div>


    <div class="card">

      <h2>📷 Lector de boletos</h2>

      <div class="small">
        Escanea el código de barras del boleto con la cámara del iPhone.
      </div>

      <div class="ticket-scanner">

        <button
          id="startScannerButton"
          class="primary"
          onclick="startTicketScanner()"
        >
          📷 Escanear boleto
        </button>

        <video
          id="ticketScannerVideo"
          playsinline
          muted
          autoplay
          style="display:none"
        ></video>

        <div
          id="ticketScannerStatus"
          class="scanner-status"
        >
          Listo para escanear.
        </div>

        <div id="scannedTicketResult"></div>

        <div class="scanner-actions">

          <button
            id="stopScannerButton"
            class="secondary"
            onclick="stopTicketScanner()"
            style="display:none"
          >
            ⏹️ Detener cámara
          </button>

        </div>

        <label>
          O escribe el código manualmente
        </label>

        <input
          id="manualTicketBarcode"
          type="text"
          autocomplete="off"
          placeholder="KRM-..."
        >

        <button
          class="secondary"
          style="margin-top:10px;width:100%"
          onclick="validateManualTicket()"
        >
          🔎 Validar código
        </button>

      </div>

    </div>


    <div class="card">

      <h2>Productos</h2>

      <div class="product-grid">

        ${
          products.length
          ?
          products.map(product => `

            <button
              class="product"
              onclick="addToCart(${product.id})"
            >

              <div class="product-name">
                ${escapeHtml(product.name)}
              </div>

              <div class="product-price">
                ${money(product.price)}
              </div>

            </button>

          `).join("")
          :
          `
            <div class="empty">
              No hay productos activos.
            </div>
          `
        }

      </div>

    </div>


    <div class="card">

      <h2>Carrito</h2>

      ${
        cart.length
        ?
        cart.map(item => `

          <div class="cart-item">

            <div>

              <div class="cart-name">
                ${escapeHtml(item.name)}
                × ${item.quantity}
              </div>

              <div class="small">
                ${money(item.price)} c/u
              </div>

            </div>

            <strong>
              ${money(item.price * item.quantity)}
            </strong>

          </div>

        `).join("")
        :
        `
          <div class="empty">
            Agrega productos.
          </div>
        `
      }

      <div class="total">

        <span>Total</span>

        <span>
          ${money(cartTotal())}
        </span>

      </div>

      ${
        cart.length
        ?
        `

          <label>
            💵 Efectivo recibido
          </label>

          <input
            id="cashReceived"
            type="number"
            min="0"
            step="0.01"
            value=""
            oninput="updateChange()"
            placeholder="0.00"
          >

          <div class="stat">

            <span>
              Cambio
            </span>

            <strong id="changeValue">
              ${money(0)}
            </strong>

          </div>

          <button
            class="primary"
            onclick="confirmSale()"
          >
            ✅ CONFIRMAR VENTA
          </button>

          <button
            class="danger"
            onclick="clearCart()"
          >
            🗑️ Vaciar carrito
          </button>

        `
        :
        ""
      }

    </div>

  `;

}


/* =====================================================
   LECTOR DE BOLETOS
   ===================================================== */

function setScannerStatus(message, type = ""){

  const status = document.getElementById("ticketScannerStatus");

  if(!status) return;

  status.className = "scanner-status" + (type ? " " + type : "");
  status.textContent = message;
}


function renderScannedTicket(ticket){

  const box = document.getElementById("scannedTicketResult");

  if(!box) return;

  if(!ticket){
    box.innerHTML = "";
    return;
  }

  if(ticket.used){

    box.innerHTML = `
      <div class="error" style="margin-top:12px">
        🔴 Este boleto ya fue utilizado.
        <br>
        <span class="small">Código: ${escapeHtml(ticket.barcode)}</span>
      </div>
    `;

    return;
  }

  box.innerHTML = `
    <div class="card" style="margin:12px 0 0;padding:18px;background:#f0fdf4">
      <h3 style="margin-top:0">🟢 Boleto válido</h3>
      <div><strong>Producto:</strong> ${escapeHtml(ticket.name)}</div>
      <div><strong>Importe:</strong> ${money(ticket.amount ?? ticket.price)}</div>
      <div class="small" style="margin-top:6px">Código: ${escapeHtml(ticket.barcode)}</div>

      <div class="status" style="margin-top:14px">
        ✅ Agregado al total. Confirma la venta para finalizar.
      </div>
    </div>
  `;
}


async function validateTicketBarcode(barcode){

  const cleanBarcode = String(barcode || "").trim();

  if(!cleanBarcode){
    setScannerStatus("Escribe o escanea un código de barras.", "scanner-invalid");
    return;
  }

  if(!db){
    setScannerStatus("Supabase no está conectado.", "scanner-invalid");
    return;
  }

  if(!activeEvent){
    setScannerStatus("No hay un evento activo.", "scanner-invalid");
    return;
  }

  setScannerStatus("🔎 Buscando boleto...", "");
  scannedTicket = null;
  renderScannedTicket(null);

  const result = await db
    .from("tickets")
    .select("*")
    .eq("event_id", activeEvent.id)
    .eq("barcode", cleanBarcode)
    .maybeSingle();

  if(result.error){
    console.error("Error validando boleto:", result.error);
    setScannerStatus("❌ No se pudo consultar el boleto.", "scanner-invalid");
    return;
  }

  if(!result.data){
    setScannerStatus("❌ Boleto no encontrado para este evento.", "scanner-invalid");
    return;
  }

  scannedTicket = result.data;

  if(scannedTicket.used){
    setScannerStatus("🔴 Boleto ya utilizado.", "scanner-invalid");
    renderScannedTicket(scannedTicket);
    return;
  }

  // El boleto válido se agrega automáticamente al carrito.
  // No se marca como usado todavía; se marca al confirmar la venta.
  const ticketCode = String(scannedTicket.barcode || "");

  if(pendingTicketCodes.includes(ticketCode)){
    setScannerStatus("⚠️ Este boleto ya está agregado a la venta.", "scanner-invalid");
    renderScannedTicket(scannedTicket);
    return;
  }

  addTicketToCart(scannedTicket);
  pendingTicketCodes.push(ticketCode);

  setScannerStatus("🟢 Boleto agregado al total.", "scanner-valid");
  renderScannedTicket(scannedTicket);

  // Actualizamos inmediatamente el total del carrito.
  renderSell();
}


async function validateManualTicket(){

  const input = document.getElementById("manualTicketBarcode");

  await validateTicketBarcode(input?.value || "");
}


async function startTicketScanner(){

  try{

    if(!activeEvent){
      alert("❌ No hay evento activo.");
      return;
    }

    if(!db){
      alert("❌ Supabase no está conectado.");
      return;
    }

    if(
      typeof ZXingBrowser === "undefined" ||
      !ZXingBrowser.BrowserMultiFormatOneDReader
    ){
      alert("❌ No se pudo cargar el lector de códigos de barras. Recarga la página e inténtalo nuevamente.");
      return;
    }

    const video = document.getElementById("ticketScannerVideo");
    const startButton = document.getElementById("startScannerButton");
    const stopButton = document.getElementById("stopScannerButton");

    if(!video) return;

    // Cerramos cualquier lector/cámara anterior antes de iniciar uno nuevo.
    stopTicketScanner();

    video.style.display = "block";
    video.setAttribute("playsinline", "true");
    video.setAttribute("autoplay", "true");
    video.muted = true;

    if(startButton) startButton.style.display = "none";
    if(stopButton) stopButton.style.display = "block";

    setScannerStatus("📷 Abriendo cámara...", "");

    // Los boletos se generan como CODE128, por lo que usamos el lector 1D.
    // decodeOnce evita lecturas repetidas del mismo boleto.
    const reader = new ZXingBrowser.BrowserMultiFormatOneDReader();
    ticketScanner = {
      stop: () => {
        try{
          const stream = video.srcObject;
          if(stream && stream.getTracks){
            stream.getTracks().forEach(track => track.stop());
          }
        }catch(error){
          console.warn("No se pudo detener la cámara:", error);
        }
      }
    };

    const result = await reader.decodeOnceFromVideoDevice(
      undefined,
      video
    );

    if(!result){
      throw new Error("No se detectó ningún código.");
    }

    const barcode = String(result.getText() || "").trim();

    stopTicketScanner();

    if(!barcode){
      setScannerStatus("❌ El código leído está vacío.", "scanner-invalid");
      return;
    }

    setScannerStatus("🔎 Código leído: " + barcode, "");
    await validateTicketBarcode(barcode);

  }catch(error){

    console.error("Error iniciando lector:", error);

    stopTicketScanner();

    let message = "❌ No se pudo leer el código.";

    if(error?.name === "NotAllowedError"){
      message = "❌ No se permitió el acceso a la cámara. Revisa el permiso de cámara de Safari.";
    }else if(error?.name === "NotFoundError"){
      message = "❌ No se encontró una cámara disponible.";
    }else if(error?.message){
      message += " " + error.message;
    }

    setScannerStatus(message, "scanner-invalid");

  }
}


function stopTicketScanner(){

  try{
    if(ticketScanner && typeof ticketScanner.stop === "function"){
      ticketScanner.stop();
    }
  }catch(error){
    console.warn("No se pudo detener el lector:", error);
  }

  ticketScanner = null;

  const video = document.getElementById("ticketScannerVideo");
  const startButton = document.getElementById("startScannerButton");
  const stopButton = document.getElementById("stopScannerButton");

  if(video){
    try{
      const stream = video.srcObject;
      if(stream && stream.getTracks){
        stream.getTracks().forEach(track => track.stop());
      }
    }catch(error){
      console.warn("No se pudo detener la cámara:", error);
    }

    video.srcObject = null;
    video.style.display = "none";
  }

  if(startButton) startButton.style.display = "block";
  if(stopButton) stopButton.style.display = "none";
}


async function redeemScannedTicket(){

  if(!scannedTicket){
    alert("❌ Primero escanea un boleto válido.");
    return;
  }

  if(scannedTicket.used){
    alert("🔴 Este boleto ya fue utilizado.");
    return;
  }

  if(!db){
    alert("❌ Supabase no está conectado.");
    return;
  }

  const confirmed = confirm(
    "¿Canjear este boleto?\n\n" +
    scannedTicket.name + "\n" +
    money(scannedTicket.amount ?? scannedTicket.price)
  );

  if(!confirmed) return;

  const result = await db
    .from("tickets")
    .update({
      used:true,
      used_at:new Date().toISOString()
    })
    .eq("event_id", activeEvent.id)
    .eq("barcode", scannedTicket.barcode)
    .eq("used", false)
    .select()
    .maybeSingle();

  if(result.error){
    console.error("Error canjeando boleto:", result.error);
    alert("❌ No se pudo canjear el boleto:\n\n" + result.error.message);
    return;
  }

  if(!result.data){
    alert("🔴 El boleto ya fue utilizado o ya no está disponible.");
    scannedTicket = null;
    renderScannedTicket(null);
    setScannerStatus("Boleto no disponible.", "scanner-invalid");
    return;
  }

  scannedTicket = result.data;

  alert(
    "✅ Boleto canjeado\n\n" +
    scannedTicket.name + "\n" +
    money(scannedTicket.amount ?? scannedTicket.price)
  );

  setScannerStatus("✅ Boleto canjeado correctamente.", "scanner-valid");
  renderScannedTicket(scannedTicket);

  await loadTickets();
}

function addToCart(productId){

  const product =
    products.find(
      p => Number(p.id) === Number(productId)
    );

  if(!product){

    alert("Producto no encontrado.");

    return;

  }

  const existing =
    cart.find(
      item => Number(item.id) === Number(productId)
    );

  if(existing){

    existing.quantity++;

  }else{

    cart.push({

      id:product.id,

      name:product.name,

      price:Number(product.price),

      quantity:1

    });

  }

  renderSell();

}


function addTicketToCart(ticket){

  const ticketProductId = ticket.product_id ?? ("ticket-" + String(ticket.id));
  const ticketPrice = Number(ticket.amount ?? ticket.price ?? 0);
  const ticketName = String(ticket.name || "Boleto");

  const existing = cart.find(item =>
    String(item.id) === String(ticketProductId) &&
    item.ticketBased === true
  );

  if(existing){
    existing.quantity++;
    if(!Array.isArray(existing.ticketCodes)){
      existing.ticketCodes = [];
    }
    existing.ticketCodes.push(String(ticket.barcode));
  }else{
    cart.push({
      id: ticketProductId,
      name: ticketName,
      price: ticketPrice,
      quantity: 1,
      ticketBased: true,
      ticketCodes: [String(ticket.barcode)]
    });
  }
}


function cartTotal(){

  return cart.reduce(
    (sum,item) =>
      sum + (
        Number(item.price) *
        Number(item.quantity)
      ),
    0
  );

}


function clearCart(){

  cart = [];
  pendingTicketCodes = [];
  scannedTicket = null;

  renderSell();

}


function updateChange(){

  const input =
    document.getElementById("cashReceived");

  const output =
    document.getElementById("changeValue");

  if(!input || !output){

    return;

  }

  const received =
    Number(input.value || 0);

  const total =
    cartTotal();

  const change =
    Math.max(0,received-total);

  output.textContent =
    money(change);

}

async function confirmSale(){

  if(!db){

    alert("Supabase no está conectado.");

    return;

  }

  if(!activeEvent){

    alert("No hay evento activo.");

    return;

  }

  if(!cart.length){

    alert("El carrito está vacío.");

    return;

  }


  const total =
    cartTotal();

  const cashInput =
    document.getElementById("cashReceived");

  const cashReceived =
    Number(cashInput?.value || 0);

  if(cashReceived < total){

    alert(
      `Faltan ${money(total-cashReceived)}`
    );

    return;

  }

  const change =
    cashReceived-total;


  /* ==========================================
     1. CREAR VENTA
     ========================================== */

  const saleResult =
    await db
      .from("sales")
      .insert({

        event_id:activeEvent.id,

        total:total,

        cash_received:cashReceived,

        change_given:change,

        items:cart.map(item => ({
          product_id:item.id,
          product_name:item.name,
          price:item.price,
          quantity:item.quantity,
          subtotal:item.price * item.quantity
        }))

      })
      .select()
      .single();


  if(saleResult.error){

    alert(saleResult.error.message);

    console.error(saleResult.error);

    return;

  }


  const sale =
    saleResult.data;


  /* ==========================================
     2. DETALLE DE VENTA
     ========================================== */

  const items =
    cart.map(item => ({

      sale_id:sale.id,

      product_id:item.id,

      product_name:item.name,

      price:item.price,

      quantity:item.quantity,

      subtotal:
        item.price *
        item.quantity

    }));


  const itemResult =
    await db
      .from("sale_items")
      .insert(items);


  if(itemResult.error){

    alert(itemResult.error.message);

    console.error(itemResult.error);

    return;

  }


  /* ==========================================
     3. REGISTRAR ENTRADA DE EFECTIVO
     ========================================== */

  const movementResult =
    await db
      .from("cash_movements")
      .insert({

        event_id:activeEvent.id,

        type:"in",

        amount:cashReceived,

        detail:`Venta #${sale.id}`

      });


  if(movementResult.error){

    alert(
      "La venta se registró, pero hubo un problema con caja:\n\n" +
      movementResult.error.message
    );

    console.error(movementResult.error);

    return;

  }


  // Los boletos escaneados se marcan como usados SOLO después de registrar la venta.
  if(pendingTicketCodes.length){
    const usedAt = new Date().toISOString();

    for(const code of pendingTicketCodes){
      const ticketResult = await db
        .from("tickets")
        .update({
          used:true,
          used_at:usedAt
        })
        .eq("event_id", activeEvent.id)
        .eq("barcode", code)
        .eq("used", false);

      if(ticketResult.error){
        console.error("No se pudo marcar boleto como usado:", ticketResult.error);
      }
    }
  }

  alert(
    `✅ Venta registrada\n\n` +
    `Total: ${money(total)}\n` +
    `Efectivo: ${money(cashReceived)}\n` +
    `Cambio: ${money(change)}`
  );


  cart = [];
  pendingTicketCodes = [];
  scannedTicket = null;


  await loadAll();

  renderSell();

}

async function createTicket(){

  try{

    if(!db){
      alert("❌ Supabase no está conectado.");
      return;
    }

    if(!activeEvent){
      alert("❌ No hay evento activo.");
      return;
    }

    const select = document.getElementById("ticketProduct");
    const quantityInput = document.getElementById("ticketQuantity");

    if(!select || !select.value){
      alert("❌ Selecciona un producto.");
      return;
    }

    const quantity = Number.parseInt(quantityInput?.value || "1", 10);

    if(!Number.isInteger(quantity) || quantity < 1 || quantity > 5000){
      alert("❌ La cantidad debe ser un número entre 1 y 5,000.");
      return;
    }

    const product = products.find(
      p => String(p.id) === String(select.value)
    );

    if(!product){
      alert("❌ No se encontró el producto.");
      return;
    }

    const price = Number(product.price);

    if(!Number.isFinite(price)){
      alert("❌ El precio del producto no es válido.");
      return;
    }

    // Generamos todos los boletos antes de enviarlos a Supabase.
    // Cada boleto recibe un código único, incluso si se generan cientos.
    const rows = [];
    const now = Date.now();

    for(let i = 0; i < quantity; i++){

      const uniquePart =
        (now + i).toString(36).toUpperCase() +
        "-" +
        crypto.randomUUID().replace(/-/g, "").substring(0, 8).toUpperCase();

      rows.push({
        event_id: activeEvent.id,
        barcode: "KRM-" + uniquePart,
        product_id: product.id,
        name: product.name,
        price: price,
        used: false,
        amount: price
      });
    }

    // Desactivamos el botón durante la generación para evitar duplicados
    // por doble clic.
    const button = document.querySelector('#screen button[onclick="createTicket()"]');
    if(button){
      button.disabled = true;
      button.textContent = "⏳ Generando boletos...";
    }

    const result = await db
      .from("tickets")
      .insert(rows)
      .select("*");

    if(result.error){
      console.error("ERROR CREANDO BOLETOS:", result.error);
      alert(
        "❌ No se pudieron crear los boletos:\n\n" +
        result.error.message
      );
      return;
    }

    const created = result.data || [];

    await loadTickets();
    await renderTickets();

    alert(
      `✅ Boletos generados correctamente\n\n` +
      `Producto: ${product.name}\n` +
      `Cantidad: ${created.length}\n` +
      `Total: ${money(price * created.length)}`
    );

  }catch(error){

    console.error("ERROR GENERANDO BOLETOS:", error);

    alert(
      "❌ Error al generar boletos:\n\n" +
      (error?.message || String(error))
    );

  }
}

        document.body.insertAdjacentHTML('afterbegin', '<p style="font-family:Arial;color:#b91c1c">No se pudieron generar los códigos de barras.</p>');
        console.error(e);
      }
    } else {
      setTimeout(ready, 150);
    }
  }
  window.addEventListener('load', ready);
})();
<\/script>
</body>
</html>`;

  // Escribimos directamente en la ventana nueva. Esto es más estable en Safari/iPhone
  // que navegar a un Blob URL y evita que la planilla quede en blanco o no aparezca.
  try {
    printWindow.document.open();
    printWindow.document.write(sheetHTML);
    printWindow.document.close();
  } catch(error){
    console.error("ERROR ABRIENDO PLANILLA:", error);
    try { printWindow.close(); } catch(e) {}
    alert("⚠️ No se pudo preparar la planilla para impresión.");
  }
}

function printTicket(ticket){

  if(!ticket){
    alert("⚠️ No se encontró el boleto.");
    return;
  }

  const printWindow = window.open("about:blank", "_blank");

  if(!printWindow){
    alert("⚠️ Safari bloqueó la ventana. Permite ventanas emergentes para KERMÉS POS.");
    return;
  }

  openPrintableTicket(printWindow, ticket);
}


function openPrintableTicket(printWindow, ticket){

  if(!printWindow || printWindow.closed){
    alert("⚠️ No se pudo abrir el boleto para impresión.");
    return;
  }

  const barcodeValue = String(ticket.barcode || "");
  const productName = String(ticket.name || "");
  const amount = Number(ticket.amount ?? ticket.price ?? 0);

  // Documento completamente independiente de KERMÉS POS.
  // No reutiliza el HTML de la aplicación, por lo que no puede duplicar la interfaz.
  const ticketHTML = `<!doctype html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boleto KERMÉS</title>

  }
  @media print {
    body { padding: 0; }
    .ticket { border: 2px solid #111827; }
  }
</style>
</head>
<body>
  <div class="ticket">
    <div class="brand">🎪 KERMÉS POS</div>
    <div class="event">${escapeHtml(activeEvent ? activeEvent.name : "Kermés")}</div>
    <div class="product">${escapeHtml(productName)}</div>

    <svg id="barcode"></svg>

<script>
(function(){
  function ready(){
    if(typeof JsBarcode === 'function'){
      JsBarcode('#barcode', ${JSON.stringify(barcodeValue)}, {
        format: 'CODE128',

        height: 72,

      });
      setTimeout(function(){ window.print(); }, 600);
    } else {

  window.addEventListener('load', ready);
})();
<\/script>
</body>
</html>`;

  // Blob URL evita que Safari/GitHub Pages vuelva a cargar index.html.
  const blob = new Blob([ticketHTML], {type: "text/html;charset=utf-8"});
  const url = URL.createObjectURL(blob);

  printWindow.location.href = url;

  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

/* =====================================================
   ADMINISTRAR PRODUCTOS
   ===================================================== */

async function addProduct(){

  if(!db){
    alert("❌ Supabase no está conectado.");
    return;
  }

  const nameInput = document.getElementById("newProductName");
  const priceInput = document.getElementById("newProductPrice");

  const name = String(nameInput?.value || "").trim();
  const price = Number(priceInput?.value);

  if(!name){
    alert("❌ Escribe el nombre del producto.");
    return;
  }

  if(!Number.isFinite(price) || price <= 0){
    alert("❌ Escribe un precio válido mayor a 0.");
    return;
  }

  const button = document.querySelector('.admin-product-form .primary');
  if(button){
    button.disabled = true;
    button.textContent = "⏳ AGREGANDO...";
  }

  try{

    const result = await db
      .from("products")
      .insert({
        name: name,
        price: price,
        active: true
      })
      .select("*")
      .single();

    if(result.error){
      throw result.error;
    }

    await loadProducts();

    alert(`✅ Producto agregado correctamente.\n\n${name} — ${money(price)}`);

    renderAdmin();

  }catch(error){

    console.error(error);
    alert("❌ No se pudo agregar el producto: " + (error.message || error));

  }finally{

    if(button){
      button.disabled = false;
      button.textContent = "➕ AGREGAR PRODUCTO";
    }

  }

}


async function deactivateProduct(productId){

  if(!db){
    alert("❌ Supabase no está conectado.");
    return;
  }

  const product = products.find(p => Number(p.id) === Number(productId));

  if(!product){
    alert("❌ No se encontró el producto.");
    return;
  }

  const confirmed = confirm(
    `¿Eliminar el producto "${product.name}" de la venta?\n\n` +
    `Se conservarán sus ventas y boletos anteriores.`
  );

  if(!confirmed){
    return;
  }

  try{

    const result = await db
      .from("products")
      .update({active:false})
      .eq("id", productId);

    if(result.error){
      throw result.error;
    }

    await loadProducts();
    renderAdmin();

  }catch(error){

    console.error(error);
    alert("❌ No se pudo eliminar el producto: " + (error.message || error));

  }

}


/* =====================================================
   NUEVO EVENTO
   ===================================================== */

async function newEvent(){

  if(!db){

    alert("Supabase no está conectado.");

    return;

  }


  const name =
    prompt(
      "Nombre de la nueva Kermés:",
      "Kermés Septiembre 2026"
    );


  if(!name || !name.trim()){

    return;

  }


  /*
   * Desactivamos el evento anterior
   */

  if(activeEvent){

    const update =
      await db
        .from("events")
        .update({active:false})
        .eq("id",activeEvent.id);


    if(update.error){

      alert(update.error.message);

      return;

    }

  }


  /*
   * Creamos nuevo evento
   */

  const result =
    await db
      .from("events")
      .insert({

        name:name.trim(),

        active:true

      })
      .select()
      .single();


  if(result.error){

    alert(result.error.message);

    console.error(result.error);

    return;

  }


  activeEvent =
    result.data;


  await loadAll();


  alert(
    `🎪 Evento creado:\n${activeEvent.name}`
  );


  show("sell");

}
